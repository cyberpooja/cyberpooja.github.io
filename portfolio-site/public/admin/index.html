<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: a drop-in, open-source replacement for Decap/Netlify CMS with a
         much closer-to-Medium WYSIWYG editing experience. Loaded only on this page,
         never on the public site. See admin/config.yml for collection definitions
         and ../../CMS-SETUP.md for the OAuth backend this login flow depends on.

         Pinned to an exact version + SRI hash (not "@latest") so an upstream
         compromise of the unpkg CDN or the @sveltia/cms package can't silently
         swap in malicious JS that would run with this page's GitHub OAuth token.
         To upgrade: bump the version below, then regenerate the hash with
           curl -s https://unpkg.com/@sveltia/cms@<version>/dist/sveltia-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
         If you skip the hash update, the browser will simply refuse to load the
         script (fails safe) rather than running an unverified version. -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.250.1/dist/sveltia-cms.js"
      integrity="sha384-0w9lix5secQDl5n7BX0n4v4ufSZM6VZI9Ov7SAVYPG5Z4lMN3i3OYoljubY5vdio"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
