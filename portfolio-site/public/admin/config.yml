# Sveltia CMS configuration.
#
# NOT YET WIRED TO GITHUB — see ../../CMS-SETUP.md before this can authenticate
# or publish anything. The fields/collections below are fully configured and
# will work as soon as the backend block is filled in.
#
# For local testing before any of that is set up: open /admin/ and click
# "Work with Local Repository" on the Sveltia CMS login screen (uses the
# File System Access API in Chromium browsers — no proxy server needed).
# `local_backend: true` is a Decap-only option and does nothing here.

backend:
  name: github
  # TODO: set to "your-username/your-repo" once the GitHub repo exists.
  repo: cyberpooja/cyberpooja.github.io
  branch: main
  # TODO: set to the URL of your deployed OAuth worker (see ../../CMS-SETUP.md).
  base_url: https://your-oauth-worker.example.workers.dev

media_folder: "portfolio-site/public/uploads"
public_folder: "/portfolio/uploads"

collections:
  - name: research
    label: "Security Research"
    folder: "portfolio-site/src/content/research"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: text }
      - { label: "Publish Date", name: pubDate, widget: datetime }
      - { label: "Updated Date", name: updatedDate, widget: datetime, required: false }
      - { label: "Author", name: author, widget: string, default: "Pooja" }
      - label: "Category"
        name: category
        widget: select
        options: ["Android Security", "Web Security", "API Security", "Product Security", "AI Security", "Reverse Engineering"]
      - { label: "Tags", name: tags, widget: list, default: [] }
      - { label: "Cover Image", name: coverImage, widget: image, required: false }
      - { label: "Cover Image Alt Text", name: coverImageAlt, widget: string, required: false }
      - { label: "CVE ID", name: cve, widget: string, required: false }
      - label: "Severity"
        name: severity
        widget: select
        required: false
        options: ["critical", "high", "medium", "low", "informational"]
      - { label: "Affected Systems", name: affectedSystems, widget: list, default: [] }
      - { label: "Draft", name: draft, widget: boolean, default: true }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "SEO Description", name: seoDescription, widget: text, required: false }
      - { label: "Body", name: body, widget: markdown }

  - name: blog
    label: "Blog"
    folder: "portfolio-site/src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: text }
      - { label: "Publish Date", name: pubDate, widget: datetime }
      - { label: "Updated Date", name: updatedDate, widget: datetime, required: false }
      - { label: "Author", name: author, widget: string, default: "Pooja" }
      - label: "Category"
        name: category
        widget: select
        options: ["Web Security", "Tutorials", "Security Concepts", "Walkthroughs", "AI Security", "Mobile Security"]
      - { label: "Tags", name: tags, widget: list, default: [] }
      - { label: "Cover Image", name: coverImage, widget: image, required: false }
      - { label: "Cover Image Alt Text", name: coverImageAlt, widget: string, required: false }
      - { label: "Draft", name: draft, widget: boolean, default: true }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "SEO Description", name: seoDescription, widget: text, required: false }
      - { label: "Body", name: body, widget: markdown }

  - name: tools
    label: "Tools & Projects"
    folder: "portfolio-site/src/content/tools"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: text }
      - { label: "Publish Date", name: pubDate, widget: datetime }
      - { label: "Updated Date", name: updatedDate, widget: datetime, required: false }
      - label: "Category"
        name: category
        widget: select
        options: ["Android Security", "Web Security", "API Security", "Security Automation", "Reverse Engineering"]
      - { label: "Tags", name: tags, widget: list, default: [] }
      - { label: "Cover Image", name: coverImage, widget: image, required: false }
      - { label: "Cover Image Alt Text", name: coverImageAlt, widget: string, required: false }
      - { label: "Repository URL", name: repoUrl, widget: string, required: false }
      - { label: "Download URL", name: downloadUrl, widget: string, required: false }
      - { label: "Docs URL", name: docsUrl, widget: string, required: false }
      - label: "Status"
        name: status
        widget: select
        default: active
        options: ["active", "maintenance", "archived"]
      - { label: "Key Features", name: features, widget: list, default: [] }
      - label: "Screenshots"
        name: screenshots
        widget: list
        default: []
        fields:
          - { label: "Image", name: src, widget: image }
          - { label: "Alt Text", name: alt, widget: string }
      - { label: "Draft", name: draft, widget: boolean, default: true }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "SEO Description", name: seoDescription, widget: text, required: false }
      - { label: "Body", name: body, widget: markdown }
